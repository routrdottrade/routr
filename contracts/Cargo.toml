[workspace]
resolver = "2"
members = ["routr"]

[workspace.package]
edition = "2021"
rust-version = "1.93"

license = "BUSL-1.1"
repository = "https://github.com/routrdottrade/routr"

[workspace.dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"
near-workspaces = "0.23.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
