[package]
name = "routr"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

repository = "https://github.com/routrdottrade/routr"
description = "routr: a launch venue any launchpad can use; virtual-reserve constant-product pools with locked seed liquidity, per-platform fee routing, O(1) deposits"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
